services:
   db:
      image: ${DATEN_IMAGE:-jhnnsrs/daten:next}
      # Throwaway test DB: trade durability for speed
      command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      environment:
         POSTGRES_MULTIPLE_DATABASES: testdb
         POSTGRES_PASSWORD: test
         POSTGRES_USER: test
      # No host port: docker picks a free one and `backend_stack` asks the running stack
      # which, so parallel suites under mounts/ never collide on a pinned port.
      ports:
        - 5432
   mail:
      # A real mail server: SMTP, IMAP and POP3, plain and TLS (self-signed), with a REST API
      # (8080) the tests create users through. Authentication is on, so a wrong password fails.
      image: greenmail/standalone:2.1.3
      environment:
         GREENMAIL_OPTS: -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
      ports:
        - 3025   # SMTP (seeding)
        - 3465   # SMTPS
        - 3143   # IMAP
        - 3993   # IMAPS
        - 3110   # POP3
        - 3995   # POP3S
        - 8080   # REST API
   dovecot:
      # A second IMAP server, for what GreenMail lacks: CONDSTORE/QRESYNC (and UIDPLUS, MOVE).
      # The image's default config: any user name, password "pass", a mailbox per user.
      image: dovecot/dovecot:2.3-latest
      ports:
        - 993    # IMAPS (self-signed)
   fakeoauth:
      # A stand-in for Google's and Microsoft's OAuth token endpoints (code + PKCE, refresh,
      # revocation). Built locally, never pulled.
      build: ./fakeoauth
      ports:
        - 8000
   rustfs:
      # S3 for the datalayer (raw messages, attachments). The bucket is created by `conftest.datalayer`.
      image: rustfs/rustfs:latest
      environment:
         RUSTFS_ACCESS_KEY: kuverttestroot
         RUSTFS_SECRET_KEY: kuverttestrootsecret
         RUSTFS_VOLUMES: /data
         RUSTFS_ADDRESS: ":9000"
      ports:
        - 9000
