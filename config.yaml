django:
  admin:
    email: admin@admin.com
    password: admin
    username: admin
  debug: false
  hosts:
  - "*"
  secret_key: change-me-kuvert-dev-secret-key
redis:
  host: redis
  port: 6379
authentikate:
  # authentikate 4.0 requires AUDIENCE. "*" (ANY_AUDIENCE) accepts a token minted
  # for any service; the `aud` claim itself is still required. Replace with this
  # service's identifier to check which service the token was minted for.
  audience: "*"
  issuers:
  - kind: rsa
    iss: lok
    kid: lok-key-1
    public_key: ssh-rsa 
  static_tokens: {}
postgres:
  db_name: kuvert
  engine: django.db.backends.postgresql
  host: db
  password: postgres
  port: 5432
  username: fostgres
# Mailbox passwords and OAuth tokens are encrypted with this Fernet key (never commit it):
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > kuvert.fernet
secrets:
  key_path: /secrets/kuvert.fernet
